name: Deploy

on:
  push:
    branches:
      - dev
      - main
      - fix/*
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone Rin repository
        uses: actions/checkout@v4
        with:
          path: Rin

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1

      - name: Generate wrangler.toml
        run: |
          cat <<EOF > Rin/wrangler.toml
          name = "${{ env.WORKER_NAME }}"
          main = "server/src/_worker.ts"
          compatibility_date = "2024-05-29"
          compatibility_flags = ["nodejs_compat"]

          [triggers]
          crons = ["*/20 * * * *"]

          [vars]
          FRONTEND_URL = "${{ env.FRONTEND_URL }}"
          S3_FOLDER = "${{ env.S3_FOLDER }}"
          S3_CACHE_FOLDER = "${{ env.S3_CACHE_FOLDER }}"
          S3_REGION = "${{ env.S3_REGION }}"
          S3_ENDPOINT = "${{ env.S3_ENDPOINT }}"
          S3_ACCESS_HOST = "${{ env.S3_ACCESS_HOST }}"
          S3_BUCKET = "${{ env.S3_BUCKET }}"
          S3_FORCE_PATH_STYLE = "${{ env.S3_FORCE_PATH_STYLE }}"
          WEBHOOK_URL = "${{ env.WEBHOOK_URL }}"
          RSS_TITLE = "${{ env.RSS_TITLE }}"
          RSS_DESCRIPTION = "${{ env.RSS_DESCRIPTION }}"

          [[d1_databases]]
          binding = "DB"
          database_name = "${{ env.DB_NAME }}"
          database_id = "${{ secrets.D1_DATABASE_ID }}"
          EOF

      - name: Show wrangler.toml
        run: cat Rin/wrangler.toml

      - name: Find all wrangler files
        run: find . -name "wrangler*"

      - name: Search node_compat
        run: grep -r "node_compat" . || true

      - name: Deploy
        env: # Or as an environment variable
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID  }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN  }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RIN_GITHUB_CLIENT_ID: ${{ secrets.RIN_GITHUB_CLIENT_ID }}
          RIN_GITHUB_CLIENT_SECRET: ${{ secrets.RIN_GITHUB_CLIENT_SECRET }}

          DB_NAME: ${{ vars.DB_NAME }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          S3_ACCESS_HOST: ${{ vars.S3_ACCESS_HOST }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_CACHE_FOLDER: ${{ vars.S3_CACHE_FOLDER }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_FOLDER: ${{ vars.S3_FOLDER }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_FORCE_PATH_STYLE: ${{ vars.S3_FORCE_PATH_STYLE }}
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
          RSS_TITLE: ${{ vars.RSS_TITLE }}
          RSS_DESCRIPTION: ${{ vars.RSS_DESCRIPTION }}
        run: |
          cd Rin/
          bun install --frozen-lockfile
          bun scripts/migrator.ts
